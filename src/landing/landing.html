<!doctype html>
<html lang="%%LANG%%">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>%%TITLE%%</title>
<meta name="description" content="%%DESC%%">
%%HEADMETA%%
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preload" href="/landing/assets/plate-01.webp" as="image">
<style>
@font-face{font-family:"Space Grotesk";src:url(/landing/assets/fonts/SpaceGrotesk.ttf) format("truetype");font-weight:300 700;font-display:swap}
@font-face{font-family:"Geist Mono";src:url(/landing/assets/fonts/GeistMono.ttf) format("truetype");font-weight:100 900;font-display:swap}
:root{
  --bg:#0a0b0f;--panel:#12141b;--panel-2:#151824;--line:#262a36;--text:#f2f3f7;--muted:#a0a6b6;
  --lime:#c6ff3d;--violet:#7c5cff;--cyan:#7cf5ff;--scout:#3d8bff;--r:14px;
  --sans:"Space Grotesk",system-ui,sans-serif;--mono:"Geist Mono",ui-monospace,monospace;
  --pad:clamp(16px,5vw,96px);
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
body{font-family:var(--sans);overflow-x:hidden}
.mono{font-family:var(--mono);font-size:clamp(10px,.78vw,14px);letter-spacing:.08em;text-transform:uppercase}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#track{position:relative}
#stage{position:sticky;top:0;height:100vh;height:100svh;width:100%;overflow:hidden;background:var(--bg)}
#seq,#eyes,#petals,#dust{position:absolute;inset:0;width:100%;height:100%;display:block}
#petals{pointer-events:none;z-index:5}
#dust{pointer-events:none;z-index:9}
#eyes{pointer-events:none;z-index:1}
#fakecur{position:absolute;z-index:40;left:0;top:0;width:34px;height:34px;pointer-events:none;opacity:0;display:none;filter:drop-shadow(0 2px 6px rgba(0,0,0,.6))}
html.rec #fakecur{display:block}
.glow{position:absolute;z-index:2;width:9%;aspect-ratio:3/1;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;
  background:radial-gradient(closest-side,rgba(124,245,255,.8),rgba(124,245,255,.22) 55%,transparent);mix-blend-mode:screen;opacity:0}
.vignette{position:absolute;inset:0;z-index:3;pointer-events:none;
  background:radial-gradient(120% 90% at 60% 45%,transparent 55%,rgba(10,11,15,.7)),linear-gradient(90deg,rgba(10,11,15,.55),transparent 45%)}
.scene{position:absolute;inset:0;z-index:10;opacity:0;pointer-events:none;visibility:hidden}
.scene.on{pointer-events:auto}
.scene>*{position:absolute}
/* header */
#bar{position:absolute;z-index:30;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:clamp(14px,2.2vw,32px) clamp(16px,3.2vw,56px)}
#bar .l{display:flex;align-items:center;gap:clamp(10px,1.4vw,22px)}
.logo{font-family:var(--sans);font-weight:700;letter-spacing:-.045em;font-size:clamp(17px,1.4vw,24px);color:var(--text);text-decoration:none}
.logo b{color:var(--lime)}
.chip{display:inline-flex;align-items:center;gap:.5em;padding:.55em .9em;border:1px solid var(--line);border-radius:999px;background:rgba(18,20,27,.86);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#idx{color:var(--muted)}#idx em{color:var(--text);font-style:normal}
#bar .r{display:flex;align-items:center;gap:clamp(6px,.8vw,12px)}
#links{padding:.3em .4em;gap:0}
#links a{color:var(--muted);text-decoration:none;padding:.35em .6em;border-radius:999px}
#links a:hover,#links a:focus-visible{color:var(--text)}
/* thin divider between the nav items so Drops / About / Report read as three links, not one run of text */
#links a{position:relative}
#links a+a::before{content:"";position:absolute;left:0;top:28%;bottom:28%;width:1px;background:#353a48;pointer-events:none}
form .fine{color:var(--muted);font-size:11px;line-height:1.45;letter-spacing:.02em;text-transform:none}
form .fine a{color:var(--lime)}
/* language dropdown: current flag as the main button, vertical menu drops down */
#lang{position:relative;z-index:60}
#langBtn{gap:.55em;padding:.62em .8em .62em .72em;min-height:36px;color:var(--muted);font:inherit;line-height:0;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:border-color .15s,color .15s}
#langBtn .cur{display:inline-flex}#langBtn .cur[hidden]{display:none}
#langBtn:hover,#langBtn:focus-visible,#lang.open #langBtn{border-color:var(--lime);color:var(--lime)}
#langBtn:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
#lang .caret{width:10px;height:6px;transition:transform .15s}
#lang.open .caret{transform:rotate(180deg)}
#langMenu{position:absolute;top:calc(100% + 6px);right:0;flex-direction:column;gap:4px;padding:4px;border-radius:18px;background:rgba(18,20,27,.96);box-shadow:0 12px 30px rgba(0,0,0,.5)}
#langMenu[hidden]{display:none}
#langMenu button{display:flex;align-items:center;justify-content:center;min-width:46px;min-height:36px;padding:8px 12px;background:transparent;border:0;font:inherit;line-height:0;border-radius:999px;cursor:pointer;opacity:.7;-webkit-tap-highlight-color:transparent;transition:opacity .15s,background .15s}
#langMenu button:hover,#langMenu button:focus-visible{opacity:1;background:var(--panel-2)}
#langMenu button:focus-visible{outline:2px solid var(--lime);outline-offset:0}
#langMenu button[aria-current=true]{background:var(--lime);opacity:1}
#lang .flag{display:block;width:22px;height:15px;border-radius:3px;overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.18)}
#lang .flag svg{display:block;width:100%;height:100%}
#prog{position:absolute;z-index:30;left:0;bottom:0;height:2px;width:100%;transform-origin:0 50%;background:var(--lime);transform:scaleX(0)}
#load{position:absolute;z-index:29;left:0;bottom:0;height:2px;width:100%;transform-origin:0 50%;background:var(--line);transform:scaleX(0);transition:opacity .6s}
.h{font-family:var(--sans);font-weight:700;letter-spacing:-.045em;line-height:.92;text-transform:uppercase}
.pill{display:inline-flex;align-items:center;gap:.6em;padding:.7em 1.1em;border:1px solid var(--line);border-radius:999px;background:rgba(18,20,27,.7);backdrop-filter:blur(6px);color:var(--text)}
.pill i{width:.55em;height:.55em;border-radius:50%;background:var(--lime);box-shadow:0 0 10px var(--lime);display:inline-block}
/* S1 */
#s1 .pill{left:clamp(16px,3.2vw,56px);top:clamp(70px,11vh,128px)}
#s1 .cue{left:50%;bottom:2.4vh;transform:translateX(-50%);color:var(--muted)}
/* S2 */
#s2 .h{left:var(--pad);top:20vh;font-size:clamp(40px,6vw,116px);max-width:41vw}
#s2 .meter{right:clamp(16px,3.2vw,56px);top:clamp(76px,12vh,132px);width:clamp(180px,19vw,330px);padding:14px 16px;border:1px solid var(--line);background:rgba(18,20,27,.86);border-radius:12px}
.meter .row{display:flex;justify-content:space-between;color:var(--muted)}
.meter .row b{color:var(--lime);font-weight:500}
.meter .trk{height:6px;border-radius:6px;background:var(--line);margin-top:10px;overflow:hidden}
.meter .fill{height:100%;width:0;background:var(--lime);box-shadow:0 0 12px var(--lime)}
#s2 .cards{left:var(--pad);bottom:9vh;display:flex;gap:clamp(8px,1vw,18px)}
.lc{width:clamp(92px,10.5vw,200px);aspect-ratio:1.15;border-radius:var(--r);background:var(--lime);color:#0a0b0f;padding:clamp(10px,1vw,18px);display:flex;flex-direction:column;justify-content:space-between}
.lc b{font-family:var(--sans);font-size:clamp(17px,2vw,38px);letter-spacing:-.045em;line-height:.9;text-transform:uppercase}
.lc span{font-family:var(--mono);font-weight:500;font-size:clamp(10px,.85vw,15px);letter-spacing:.08em}
button.lc{border:0;font:inherit;text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;position:relative;transition:box-shadow .2s}
.lc .top{display:flex;justify-content:space-between;align-items:center}
.lc i{font-style:normal;font-family:var(--mono);font-weight:500;font-size:clamp(14px,1vw,18px);line-height:1;width:1.3em;height:1.3em;display:inline-grid;place-items:center;border-radius:50%;border:1.5px solid rgba(10,11,15,.55);transition:transform .25s}
.lc[aria-expanded=true]{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--violet),0 0 26px rgba(124,92,255,.55)}
.lc[aria-expanded=true] i{transform:rotate(45deg)}
.lc:focus-visible{outline:2px solid var(--text);outline-offset:3px}
#s2 .bub{position:absolute;bottom:calc(100% + 14px);left:0;width:min(320px,calc(100vw - 24px));z-index:3;padding:14px 16px 15px;border-radius:14px;
  background:rgba(18,20,27,.96);border:1px solid var(--lime);color:var(--text);
  box-shadow:0 0 0 1px rgba(124,92,255,.25),0 0 28px rgba(198,255,61,.18),0 18px 50px rgba(124,92,255,.32);
  font-family:var(--sans);font-size:15px;line-height:1.42;text-transform:none;letter-spacing:0;transform-origin:var(--tx,50%) 100%}
#s2 .bub[hidden]{display:none}
#s2 .bub b{display:block;font-family:var(--mono);font-weight:500;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--lime);margin-bottom:6px}
#s2 .bub::after{content:"";position:absolute;top:100%;left:var(--tx,50%);width:14px;height:14px;margin:-7px 0 0 -7px;background:inherit;border:solid var(--lime);border-width:0 1px 1px 0;transform:rotate(45deg)}
#s2 .bub.pop{animation:bubpop .22s cubic-bezier(.2,.9,.3,1.25)}
@keyframes bubpop{from{opacity:0;transform:translateY(8px) scale(.9)}to{opacity:1;transform:none}}
/* S3 */
#s3 .lab{left:var(--pad);top:16vh;color:var(--muted)}
#s3 p{left:var(--pad);top:21vh;width:min(42vw,820px);font-family:var(--sans);font-weight:700;font-size:clamp(26px,3.2vw,60px);letter-spacing:-.045em;line-height:1.06}
#s3 p span{display:block;white-space:nowrap;color:#4a4f5e;transition:color .25s}
#s3 p span.hi{color:var(--lime)}
#s3 p span.done{color:var(--text)}
/* S4 */
#s4 .lab{left:var(--pad);top:13vh;color:var(--muted)}
#s4 .h{left:var(--pad);top:17vh;font-size:clamp(48px,8.2vw,156px)}
#s4 .grid{left:var(--pad);top:37vh;display:flex;gap:clamp(10px,1.4vw,26px)}
.flip{width:clamp(150px,16.5vw,310px);aspect-ratio:3/4;perspective:1200px;cursor:pointer}
.flip .in{position:relative;width:100%;height:100%;transition:transform .7s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}
.flip.show .in{transform:rotateY(180deg)}
.flip:focus-visible{outline:2px solid var(--lime);outline-offset:4px;border-radius:18px}
.flip{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.flip:not(.show) .back,.flip.show .front{pointer-events:none}
.back h3{margin-top:.35em}
.back .btn.see{width:100%;font-size:clamp(14px,.95vw,17px);padding:.95em .8em;box-shadow:0 0 0 1px rgba(198,255,61,.35),0 10px 30px rgba(198,255,61,.22)}
.back .btn.see:focus-visible{outline:2px solid var(--text);outline-offset:3px}
.face{position:absolute;inset:0;border-radius:18px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;padding:clamp(12px,1.2vw,22px);display:flex;flex-direction:column;justify-content:flex-end}
.face.back{transform:rotateY(180deg);justify-content:space-between}
.scout .front{background:linear-gradient(180deg,#000 0%,#000 46%,#173a80 64%,var(--scout) 100%);border:1px solid var(--scout);box-shadow:0 30px 80px rgba(61,139,255,.35)}
.scout .front img{position:absolute;left:-6%;top:-6%;width:112%;-webkit-mask-image:linear-gradient(180deg,#000 66%,transparent 84%);mask-image:linear-gradient(180deg,#000 66%,transparent 84%)}
.tag{position:absolute;top:clamp(12px,1.2vw,22px);left:clamp(12px,1.2vw,22px);background:var(--lime);color:#0a0b0f;padding:.35em .6em;border-radius:6px;font-weight:500;white-space:nowrap}
/* drop type tag (BOT, PROMPT, ...): top right, outlined so it doesn't compete with the lime status tag */
.tag.ty{left:auto;right:clamp(12px,1.2vw,22px);background:rgba(10,11,15,.82);color:var(--lime);box-shadow:inset 0 0 0 1px rgba(198,255,61,.55);text-transform:uppercase}
.face h3{position:relative;font-family:var(--sans);font-weight:700;font-size:clamp(22px,2.1vw,40px);letter-spacing:-.045em;line-height:1}
.face p{position:relative;font-size:clamp(12px,.9vw,16px);line-height:1.3;margin-top:.5em;color:rgba(242,243,247,.92)}
.scout .back{background:var(--panel-2);border:1px solid var(--scout)}
.btn{display:inline-flex;justify-content:center;align-items:center;gap:.5em;background:var(--lime);color:#0a0b0f;border:0;border-radius:10px;padding:.9em 1.1em;font-family:var(--mono);font-weight:500;font-size:clamp(11px,.85vw,15px);letter-spacing:.08em;text-transform:uppercase;text-decoration:none;cursor:pointer}
.soon .face{border:1.5px dashed #3a3f4e;background:rgba(18,20,27,.74);justify-content:center;align-items:center;text-align:center;color:var(--muted)}
.soon .num{position:absolute;top:clamp(12px,1.2vw,22px);left:clamp(12px,1.2vw,22px);color:#5a6070}
.soon .face b{font-family:var(--sans);font-size:clamp(18px,1.6vw,30px);color:var(--text);letter-spacing:-.045em;display:block;margin-bottom:.4em}
/* S5 */
#s5 .lab{left:var(--pad);top:13vh;color:var(--muted)}
#s5 .h{left:var(--pad);top:17vh;font-size:clamp(40px,5.2vw,100px);max-width:46vw}
#s5 .card{left:var(--pad);top:41vh;width:min(44vw,820px);background:rgba(18,20,27,.9);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:10px;border-bottom:1px solid var(--line)}
.tabs button{background:transparent;border:0;color:var(--muted);padding:.8em;border-radius:8px;font-family:var(--mono);font-size:clamp(11px,.9vw,16px);cursor:pointer}
.tabs button:hover{color:var(--text);background:var(--panel-2)}
.tabs button.act{background:var(--lime);color:#0a0b0f}
.rows{padding:4px 18px}
.rows div{display:flex;gap:1em;align-items:center;padding:clamp(9px,1.05vw,17px) 0;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:clamp(11px,.92vw,17px);color:#4a4f5e;transition:color .3s}
.rows div:last-child{border-bottom:0}
.rows div .ck{width:1.2em;color:transparent;transition:color .3s}
.rows div.ok{color:var(--text)}.rows div.ok .ck{color:var(--lime)}
.rows div .n{color:inherit;opacity:.7}
.note{padding:14px 18px;border-top:1px solid var(--line);background:var(--panel-2);color:var(--muted);font-family:var(--mono);font-size:clamp(11px,.85vw,15px);line-height:1.5;min-height:6.2em}
/* S6 */
#s6 .h{left:var(--pad);top:13vh;font-size:clamp(40px,5.8vw,112px);line-height:.96}
#s6 .h em{font-style:normal;color:var(--lime)}
#s6 form{left:var(--pad);top:41vh;width:min(32vw,560px);background:rgba(18,20,27,.9);border:1px solid var(--line);border-radius:16px;padding:clamp(14px,1.4vw,24px);display:grid;gap:10px}
form .hd{display:flex;justify-content:space-between;color:var(--muted);padding-bottom:6px;border-bottom:1px solid var(--line)}
form label{display:grid;gap:6px;color:var(--muted)}
form input,form textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:.7em .8em;font-family:var(--mono);font-size:14px;resize:none}
form input:focus,form textarea:focus{outline:none;border-color:var(--lime)}
#s6 .board{left:0;right:0;bottom:0;height:clamp(64px,11vh,120px);border-top:1px solid var(--line);background:rgba(5,6,8,.92);display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 clamp(16px,3.2vw,56px)}
.led{font-family:var(--mono);font-weight:700;font-size:clamp(20px,3.4vw,62px);letter-spacing:.06em;color:#2b3a12;text-transform:uppercase;white-space:nowrap;
  -webkit-mask-image:radial-gradient(circle,#000 58%,transparent 64%);mask-image:radial-gradient(circle,#000 58%,transparent 64%);-webkit-mask-size:4px 4px;mask-size:4px 4px}
.led.pass{color:var(--lime);text-shadow:0 0 14px rgba(198,255,61,.9)}
#back{background:transparent;color:var(--text);border:1px solid var(--line);white-space:nowrap}
#back:hover{border-color:var(--lime);color:var(--lime)}
@media (max-aspect-ratio:1/1),(max-width:760px){
  #s2 .h,#s3 p,#s5 .card,#s5 .h,#s6 form{max-width:none;width:calc(100vw - 32px)}
  #s2 .h{top:16vh;font-size:11vw}
  #s2 .meter{top:auto;bottom:calc(9vh + 32vw);left:16px;right:auto;width:60vw}
  #s2 .cards{bottom:6vh}.lc{width:28vw}
  #s3 p{top:20vh;font-size:6.6vw}
  #s4 .h{font-size:15vw}#s4 .grid{top:32vh;gap:8px}.flip{width:29vw}
  .face h3{font-size:5vw}.face p{font-size:2.6vw}.flip .back{padding:10px 8px}.back .btn.see{font-size:14px;letter-spacing:0;gap:.3em;white-space:nowrap;padding:.85em .2em;border-radius:9px}
  #s5 .h{font-size:10vw}#s5 .card{top:28vh}
  #s6 .h{font-size:10vw}#s6 form{top:34vh}
  .led{font-size:5.6vw}
  /* portrait: keep the character's face clear, push panels to the bottom */
  #s3 p{top:auto;bottom:6vh;left:12px;width:calc(100vw - 24px);padding:12px 14px;background:rgba(10,11,15,.74);border-radius:14px;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
  #s4 .grid{top:auto;bottom:7vh}
  .scout .front p{display:none}
  .scout .front h3{font-size:4.6vw}
  .tag{font-size:2.4vw;padding:.3em .45em}
  .tag.ty{position:relative;top:auto;left:auto;right:auto;align-self:flex-start;margin-bottom:.6em} /* narrow tiles: type tag sits above the name, off the character's face */
  .soon .face b{font-size:3.9vw}
  .soon .face .mono{font-size:2.3vw}
  .led{font-size:4.6vw}
  #back{font-size:2.6vw;padding:.8em .8em}
  #s5 .card{top:auto;bottom:4vh}
  #s6 form{top:auto;bottom:calc(clamp(64px,11vh,120px) + 2vh)}
  #s2 .h,#s4 .h,#s5 .h,#s6 .h{text-shadow:0 2px 18px rgba(10,11,15,.9)}
  #idx .nm{display:none}
  #idx{display:none}
  #links a{padding:.35em .6em}
}
/* portrait phones: texts left-aligned, moved below the face band (~15-40% of the height in every hold) */
@media (max-aspect-ratio:1/1){
  #s2 .h,#s4 .h,#s4 .lab,#s5 .h,#s5 .lab,#s6 .h{left:16px;right:16px;width:auto;max-width:none;text-align:left}
  #s2 .h{top:42vh;font-size:10vw}
  #s2 .meter{left:16px;right:auto;width:60vw;bottom:calc(6vh + 25vw + 14px)}
  #s4 .lab{top:51vh}
  #s4 .h{top:55vh}
  #s5 .lab{top:40vh}
  #s5 .h{top:44vh}
  #s2 .h,#s2 .meter,#s4 .h,#s4 .lab,#s5 .h,#s5 .lab,#s5 .card{left:var(--pad)}
  #s2 .h,#s4 .h,#s4 .lab,#s5 .h,#s5 .lab{right:var(--pad)}
  #s5 .card{width:calc(100vw - 2*var(--pad))}
  #s6 .h{top:9vh}
  #s1 .pill{left:16px;top:clamp(64px,9.5vh,128px);white-space:nowrap;font-size:min(11px,2.4vw);letter-spacing:.03em;padding:.6em .8em;max-width:calc(100vw - 32px)}
  #s6 form{gap:7px;padding:12px 14px;bottom:calc(clamp(64px,11vh,120px) + 1.2vh)}
  #s6 form{grid-template-columns:1fr 1fr;gap:6px 8px;padding:10px 12px}
  #s6 form>*{grid-column:1/-1}
  #s6 form>label:nth-of-type(1),#s6 form>label:nth-of-type(2){grid-column:auto;min-width:0}
  #s6 form label{gap:3px}
  #s6 form input,#s6 form textarea{padding:.45em .6em;font-size:13px;min-width:0;width:100%}
  #s6 form textarea{height:3.2em}
  #s6 form .fine{font-size:10px;line-height:1.35}
}
html.rec *{transition:none!important}
@media (prefers-reduced-motion:reduce){#s2 .bub.pop{animation:none}.lc i,button.lc{transition:none}.flip .in,#s3 p span,.rows div,.rows div .ck{transition:none}}
</style>
</head>
<body>
<h1 class="sr">raw2top</h1>
<div id="track">

const r=(x,a,b)=>sm((x-a)/(b-a));

/* ---------- i18n ---------- */

const mani=$('#mani'), rowsEl=$('#rows');
/* portrait phones: scenes 2, 4, 5 stack the heading (and its label) just above the bottom cards/panel, 14px gap */

/* language dropdown (tap/click/keyboard; closes on outside tap, Escape, Tab out) */
{

  menu.addEventListener('keydown',e=>{const i=items.indexOf(document.activeElement);

    let x,y,a,sz;
    if(d<=0){ // pre-release shimmer: the edge trembles and heats up
      const e=(1+d/.18)*p.al; x=p.hx+Math.sin(t*31+p.ph)*.9*e; y=p.hy+Math.cos(t*27+p.ph)*.9*e; a=.25*e; sz=S*.9;
      paths[(p.lime?3:2)*NB+Math.min(NB-1,(a*NB)|0)].rect(x-sz/2,y-sz/2,sz,sz); continue;
    }
    const k=Math.pow(d,1.45);
    const sw=Math.sin(p.hy*.021+p.ph+d*4.2+t*.7)*46*k + Math.cos(p.hx*.013+d*3.1-t*.5)*26*k;
    x=p.hx + (p.vx*230*k + sw)*U;
    y=p.hy - (p.vy*380*k + Math.sin(p.hx*.017+p.ph+d*5)*22*k)*U;
    a=p.al*Math.pow(1-d,1.3)*(.78+.22*Math.sin(t*(7+p.f*5)+p.ph));
    sz=S*(1.05-.55*d)*p.s;
    if(p.col){sparks.push(x,y,a,sz,p.col);continue}
    const bucket=p.lime?(d<.12?3:0):(d<.12?2:1); // particles keep the colour of their letter; hot leading edge
    paths[bucket*NB+Math.min(NB-1,(a*NB)|0)].rect(x-sz/2,y-sz/2,sz,sz);
  }
  for(let b=0;b<4;b++){ dx.fillStyle=BCOL[b]; const k=b===1||b===2?.82:1; // white adds up faster than lime
    for(let i=0;i<NB;i++){dx.globalAlpha=k*(i+.5)/NB; dx.fill(paths[b*NB+i])} }
  for(let i=0;i<sparks.length;i+=5){ const sz=sparks[i+3]*2.6; dx.globalAlpha=Math.min(1,sparks[i+2]*1.25);
    dx.drawImage(sprite(COLS[sparks[i+4]]),sparks[i]-sz/2,sparks[i+1]-sz/2,sz,sz) }
  dx.globalAlpha=1; dx.globalCompositeOperation='source-over';
}

/* ---------- petals (light, deterministic in t and p) ---------- */
const pcv=$('#petals'),pcx=pcv.getContext('2d');let PET=[];
function petals(t,p,amt){
  pcx.setTransform(DPR,0,0,DPR,0,0);pcx.clearRect(0,0,W,H); if(amt<=0.01) return;
  for(const q of PET){
    const s=(5+q.z*8)*Math.max(.7,W/1600);
    let x=(q.x+q.wind*t+Math.sin(t*q.f+q.ph)*.02 + p*1.2*q.z)%1.1; if(x<0)x+=1.1; x=x*W-W*.05;
    let y=(q.y+q.fall*t - p*6*q.z)%1.15; if(y<0)y+=1.15; y=y*H-H*.08;
    pcx.save();pcx.translate(x,y);pcx.rotate(q.rot+q.vr*t+p*9);pcx.scale(1,.55+.45*Math.abs(Math.sin(t*q.f*1.3+q.ph)));
    pcx.globalAlpha=(.2+.45*q.z)*amt;
    const g=pcx.createLinearGradient(-s,0,s,0);g.addColorStop(0,'#ffd6e2');g.addColorStop(1,'#f39bb6');pcx.fillStyle=g;
    pcx.beginPath();pcx.moveTo(-s,0);pcx.bezierCurveTo(-s*.4,-s*.75,s*.6,-s*.7,s,-s*.08);pcx.lineTo(s*.72,0);pcx.lineTo(s,s*.08);pcx.bezierCurveTo(s*.6,s*.7,-s*.4,s*.75,-s,0);pcx.fill();
    pcx.restore();
  }
}

/* ---------- scenes ---------- */
const scenes=$$('.scene'), fill=$('#fill'),pct=$('#pct'),mstate=$('#mstate'),lcs=$$('#s2 .lc'),flips=$$('#s4 .flip'),
      tabs=$$('#tabs button'),note=$('#note'),led=$('#led'),form=$('#form'),h6=$('#s6 .h'),goggle=$('#goggle'),prog=$('#prog'),sn=$('#sn'),sname=$('#sname');
const M=RM?0:1;
/* scene 2: tap a lime card -> speech bubble explaining it (one at a time; tap again / elsewhere / Esc closes) */
const bub=$('#bub'), bubh=$('#bubh'), bubt=$('#bubt'); let bubOpen=null;
function bubPlace(){ if(!bubOpen) return;
  const cr=bubOpen.getBoundingClientRect(), pr=bub.parentElement.getBoundingClientRect(), bw=bub.offsetWidth, m=12;
  const cx=cr.left+cr.width/2, left=Math.min(Math.max(cx-bw/2,Math.max(m,pr.left)),innerWidth-m-bw);
  bub.style.left=(left-pr.left)+'px'; bub.style.setProperty('--tx',Math.min(Math.max(cx-left,18),bw-18)+'px'); }
function bubFill(){ if(!bubOpen) return; const i=bubOpen.dataset.i; bubh.textContent='#'+i+' · '+T['s2.c'+i]; bubt.textContent=T['s2.b'+i]; }
function bubClose(focus){ if(!bubOpen) return; const c=bubOpen; c.setAttribute('aria-expanded','false'); bubOpen=null; bub.hidden=true; bub.classList.remove('pop'); if(focus) c.focus(); }
function bubShow(c){ bubClose(); bubOpen=c; c.setAttribute('aria-expanded','true'); bubFill(); bub.hidden=false; bubPlace();
  bub.classList.remove('pop'); void bub.offsetWidth; bub.classList.add('pop'); }
lcs.forEach(c=>c.addEventListener('click',()=>bubOpen===c?bubClose():bubShow(c)));
document.addEventListener('pointerdown',e=>{ if(bubOpen&&!e.target.closest('#s2 .lc,#bub')) bubClose() },true);
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&bubOpen) bubClose(true) });
addEventListener('resize',bubPlace);
const mv=(el,x,y,o)=>{el.style.transform=`translate(${x*M}px,${y*M}px)`;if(o!=null)el.style.opacity=o};
const vh=()=>H, vw=()=>W;
const SC=[
  lp=>{ const o=1-r(lp,.02,.22); $('#s1 .pill').style.opacity=o; $('#s1 .cue').style.opacity=o; },
  lp=>{ const n=Math.round(r(lp,.12,.66)*100);
    fill.style.width=n+'%'; pct.textContent=n+'%'; mstate.textContent=n>=100?T['s2.pass']:T['s2.running'];
    mv($('#s2 .h'),-(1-r(lp,0,.16))*60,0,r(lp,0,.16));
    lcs.forEach((c,j)=>{const q=r(lp,.16+j*.08,.34+j*.08);mv(c,0,(1-q)*vh()*.3,q); if(q<.98&&bubOpen===c) bubClose()}); },
  lp=>{ const sp=$$('#mani span'), step=r(lp,.1,.8)*sp.length;
    sp.forEach((s,j)=>{s.classList.toggle('hi',step>j&&step<j+1.6);s.classList.toggle('done',step>=j+1.6)});
    mv(mani,0,(1-r(lp,0,.16))*40,1); },
  lp=>{ mv($('#s4 .h'),(1-r(lp,0,.2))*-80,0,r(lp,0,.16));
    flips.forEach((f,j)=>{const q=r(lp,.04+j*.07,.26+j*.07);mv(f,0,(1-q)*vh()*.22,q)});
    if(REC){const a=180*(r(lp,.44,.54)-r(lp,.76,.84));flips[0].querySelector('.in').style.transform=`rotateY(${a}deg)`} },
  lp=>{ const a=Math.min(3,Math.floor(r(lp,.12,.86)*4.0001));
    if(lp<.12){tabs.forEach(t=>t.classList.remove('act'));$$('#rows div').forEach(rw=>rw.classList.remove('ok'));note.textContent=T['note.fill']}
    else{tabs.forEach((t,j)=>t.classList.toggle('act',j===a));$$('#rows div').forEach((rw,j)=>rw.classList.toggle('ok',j<=a));note.textContent=T.notes[a]}
    mv($('#s5 .card'),0,(1-r(lp,0,.16))*60,1); },
  lp=>{ mv(h6,0,(1-r(lp,0,.2))*60,r(lp,0,.16)); mv(form,0,(1-r(lp,.08,.3))*80,r(lp,.08,.3));
    const pass=lp>=.5; led.classList.toggle('pass',pass); led.textContent=pass?T['led.pass']:T['led.run']; }
];
let P=0,TT=0;
function update(p,t,force){
  P=p; TT=t;
  const [seg,u]=locate(p);
  drawSeq(seg,u);
  drawEyes(seg,u,t);
  // scene overlays: visible only while the character holds still
  scenes.forEach((sc,i)=>{
    let o=0, lp=-1;
    if(seg.h===i){ lp=u; o = i===0?1:(i===5?r(u,0,.1):Math.min(r(u,0,.1),1-r(u,.9,1))); }
    else if(i===0&&seg.c===0) o=0;
    sc.style.opacity=o; sc.style.visibility=o>0.001?'visible':'hidden'; sc.classList.toggle('on',o>.5); if(sc.id==='s2'&&o<=.5) bubClose();
    if(lp>=0||force) SC[i](lp>=0?lp:(SEG.findIndex(s=>s.h===i)<SEG.indexOf(seg)?1:0));
  });
  // wordmark
  const q = seg.h===0 ? clamp((u-.03)/.9) : 1;
  drawDust(q,t);
  // goggles glow during the hero hold
  if(plates[0]){const [x,y,w,h]=cover(plates[0]); goggle.style.left=(x+w*.505)+'px'; goggle.style.top=(y+h*.232)+'px';}
  goggle.style.opacity = seg.h===0 ? (1-r(u,.8,1))*(.7+.3*Math.sin(t*2.2)) : 0;
  const k=Math.min(5,Math.floor(p*0+ (seg.h!=null?seg.h:(u<.5?seg.c:seg.c+1))));
  sn.textContent='0'+(k+1); sname.textContent=T.names[k];
  prog.style.transform=`scaleX(${p})`;
  petals(t,p, seg.h!=null?1:.35);
}

// tabs jump the scroll to their step
const maxScroll=()=>document.documentElement.scrollHeight-innerHeight;
function scrollToP(p){scrollTo({top:p*maxScroll(),behavior:RM?'auto':'smooth'})}
tabs.forEach((b,j)=>b.addEventListener('click',()=>{const s=SEG.find(s=>s.h===4);scrollToP(s.p0+(.12+(j+.5)/4*.74)*(s.p1-s.p0))}));
// cards: one state per card. Tap/click/Enter/Space toggles front<->back; a mouse hover previews the back.
// (The old CSS flipped on :hover/:focus-within too; on touch both stick after a tap, so a 2nd tap removed the class but the card stayed turned.)
flips.forEach(f=>{
  let pinned=false, hov=false, mute=false;
  const sync=()=>{const on=pinned||(hov&&!mute); f.classList.toggle('show',on); f.setAttribute('aria-pressed',on)};
  const toggle=()=>{pinned=!f.classList.contains('show'); mute=hov; sync()};
  f.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse'){hov=true;sync()}});
  f.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse'){hov=false;mute=false;sync()}});
  f.addEventListener('click',e=>{if(e.target.closest('a'))return; toggle()});
  f.addEventListener('keydown',e=>{if(e.target!==f)return; if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle()}});
  f.addEventListener('focusin',e=>{if(e.target!==f&&e.target.closest('.back')&&!f.classList.contains('show')){pinned=true;sync()}});
});
form.addEventListener('submit',e=>{e.preventDefault();const f=new FormData(form),nm=(f.get('name')||'').trim(),em=(f.get('email')||'').trim(),tk=(f.get('task')||'').trim();const subject=T['mail.subject']+(nm?' · '+nm:''),body=T['mail.name']+': '+nm+'\n'+T['mail.email']+': '+em+'\n\n'+T['mail.task']+':\n'+tk+'\n';location.href='mailto:raw2top@gmail.com?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body);$('#send').textContent=T['s6.sent']});
$('#back').addEventListener('click',()=>scrollTo({top:0,behavior:RM?'auto':'smooth'}));
$('#logo').addEventListener('click',e=>{e.preventDefault();scrollTo({top:0,behavior:RM?'auto':'smooth'})});

// size from the sticky stage (100svh), not innerWidth/innerHeight: on iOS the first scroll collapses the toolbar and
// grows innerHeight while the stage keeps its height, so the canvases got a taller buffer squeezed into the same box
// (character stretched ~13% wide, glow off the goggles). Same size -> nothing to rebuild.
const stage=$('#stage');
function resize(){
  const w=stage.clientWidth||innerWidth, h=stage.clientHeight||innerHeight, d=Math.min(REC?1:2,devicePixelRatio||1);
  if(w===W&&h===H&&d===DPR) return false;
  DPR=d; W=w; H=h;
  for(const c of [seq,ecv,pcv,dust]){c.width=Math.round(W*DPR);c.height=Math.round(H*DPR)}
  const R=rng(7),n=RM?0:(W<760?8:14);PET=[];for(let i=0;i<n;i++)PET.push({x:R(),y:R(),z:.35+R()*.65,ph:R()*6.28,f:.4+R()*.8,rot:R()*6.28,vr:(R()-.5)*1.6,fall:.025+R()*.04,wind:.01+R()*.025});
  buildWord(); lastKey=''; lastDust=-1; fitCards(); return true;
}
// scene 4: keep the whole card row left of the character (his left edge is at 72.5% of the hold frame)
function fitCards(){
  const grid=$('#s4 .grid'); flips.forEach(f=>f.style.width='');
  if(W/H<1||W<760||!plates[3]) return;
  const [x,,w]=cover(plates[3]), edge=x+w*.725-Math.max(24,W*.03);
  const left=grid.getBoundingClientRect().left;
  const gap=parseFloat(getComputedStyle(grid).columnGap)||16, cw=flips[0].getBoundingClientRect().width;
  const room=(edge-left-2*gap)/3; if(room<cw) flips.forEach(f=>f.style.width=Math.max(120,room)+'px');
}
addEventListener('resize',()=>{if(resize())update(P,TT,true)});
addEventListener('resize',stack); if(document.fonts) document.fonts.ready.then(stack);

// language: saved choice > ?lang= > browser default is English
// on /es/ the URL decides; on / a saved choice wins
const PAGE_LANG=document.documentElement.lang==='es'?'es':'en';
let initial=PAGE_LANG; if(PAGE_LANG==='en') try{initial=localStorage.getItem('raw2top-lang')||initial}catch(e){}
const qp=(location.search.match(/[?&]lang=(en|es)/)||[])[1]; if(qp) initial=qp;

document.fonts.load('700 100px "Space Grotesk"').catch(()=>{}).then(()=>{
  resize(); setLang(initial,false);
  if(REC){
    document.documentElement.classList.add('rec');
    window.__ready=window.__decoded().then(()=>document.fonts.ready).then(()=>true);
    window.__render=(p,t)=>{scrollTo(0,p*maxScroll());lastDust=-1;update(p,t);return true};
    update(0,0,true);
  }else{
    let cur=scrollY/Math.max(1,maxScroll()); const t0=performance.now(); let last=t0, lastMove=0, lastT=-1;
    (function loop(now){
      const target=scrollY/Math.max(1,maxScroll()), dt=Math.min(.1,Math.max(0,(now-last)/1000)); last=now;
      // ease toward the scroll target with a fixed time constant (same feel at 60 and 120 Hz)
      cur = RM?target: cur+(target-cur)*(1-Math.exp(-dt/.11)); if(Math.abs(target-cur)<1e-5)cur=target;
      if(Math.abs(target-cur)>2e-5||target!==lastT) lastMove=now; lastT=target; MOVING=now-lastMove<140;
      update(clamp(cur),(now-t0)/1000);
      requestAnimationFrame(loop);
    })(t0);
  }
});
})();
</script>
